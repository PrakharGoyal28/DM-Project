<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Robo the robot">
  <!-- antenna -->
  <line x1="50" y1="8" x2="50" y2="22" stroke="#1e3a8a" stroke-width="4" stroke-linecap="round"/>
  <circle cx="50" cy="8" r="6" fill="#facc15" stroke="#1e3a8a" stroke-width="3"/>
  <!-- ears -->
  <rect x="9" y="36" width="10" height="20" rx="4" fill="#8b5cf6" stroke="#1e3a8a" stroke-width="3"/>
  <rect x="81" y="36" width="10" height="20" rx="4" fill="#8b5cf6" stroke="#1e3a8a" stroke-width="3"/>
  <!-- head -->
  <rect x="17" y="21" width="66" height="50" rx="16" fill="#3b82f6" stroke="#1e3a8a" stroke-width="4"/>
  <rect x="25" y="29" width="50" height="33" rx="11" fill="#0f1e46"/>
  <!-- eyes and smile -->
  <circle cx="39" cy="43" r="6.5" fill="#67e8f9"/>
  <circle cx="61" cy="43" r="6.5" fill="#67e8f9"/>
  <circle cx="41" cy="41" r="2.2" fill="#ffffff"/>
  <circle cx="63" cy="41" r="2.2" fill="#ffffff"/>
  <path d="M41 53 Q50 59 59 53" fill="none" stroke="#67e8f9" stroke-width="3.5" stroke-linecap="round"/>
  <!-- cheeks -->
  <circle cx="29" cy="55" r="3" fill="#f472b6" opacity="0.8"/>
  <circle cx="71" cy="55" r="3" fill="#f472b6" opacity="0.8"/>
  <!-- body -->
  <rect x="30" y="70" width="40" height="22" rx="8" fill="#60a5fa" stroke="#1e3a8a" stroke-width="4"/>
  <circle cx="50" cy="81" r="5" fill="#facc15" stroke="#1e3a8a" stroke-width="2.5"/>
</svg>
