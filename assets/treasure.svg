  <ellipse cx="38" cy="46" rx="8" ry="4" fill="#fde047" stroke="#a16207" stroke-width="2"/>
  <ellipse cx="60" cy="46" rx="8" ry="4" fill="#fde047" stroke="#a16207" stroke-width="2"/>
  <!-- box -->
